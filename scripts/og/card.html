<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<!-- One 1200x630 social card, drawn with the site's own tokens and its own
     fonts. scripts/og.js opens this once per card with ?i=N and screenshots
     the viewport. Nothing else links to it and it never ships. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: var(--body); background: var(--ground); color: var(--ink);
  }

  .card {
    position: relative; width: 1200px; height: 630px; padding: 66px 72px 0;
    box-sizing: border-box; display: flex; flex-direction: column;
    background:
      radial-gradient(62% 54% at 96% 2%, rgba(201,150,44,.16), transparent 62%),
      radial-gradient(56% 50% at 2% 96%, rgba(140,28,47,.13), transparent 64%),
      var(--ground);
  }
  /* No grain here, deliberately. The site's noise tile is per-pixel, which is
     what PNG compresses worst: with it, a card is 270 KB instead of 25 KB,
     and at the size a feed renders a card nobody sees the texture anyway. */
  /* the maroon that signs every card */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--maroon); }

  .mark { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; }
  .mark i { font-style: normal; color: var(--maroon); }
  .mark b { font-weight: 500; color: var(--ink-3); }

  .body { flex: 1; display: flex; align-items: center; gap: 48px; }
  .copy { flex: 1 1 auto; min-width: 0; }
  .wide .copy { max-width: 1056px; }
  .art  { flex: 0 0 auto; }

  .eyebrow {
    font-family: var(--mono); font-weight: 500; font-size: 19px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--maroon);
    display: block; margin-bottom: 18px;
  }
  h1 {
    font-family: var(--display); font-weight: 700; margin: 0;
    font-size: 62px; line-height: 1.08; letter-spacing: -.028em; color: var(--ink);
  }
  .long h1 { font-size: 52px; }
  .longer h1 { font-size: 44px; }

  .meta {
    font-family: var(--mono); font-size: 19px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-2); padding-bottom: 58px;
  }

  /* a book, drawn rather than photographed, so a card needs no asset */
  .cover {
    width: 260px; height: 347px; border-radius: 10px; position: relative;
    display: flex; align-items: flex-end; padding: 26px 24px;
    box-sizing: border-box; box-shadow: var(--glow-lg);
  }
  .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 11px; border-radius: 10px 0 0 10px; background: rgba(30,16,19,.55); }
  .cover span { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.16; letter-spacing: -.02em; }

  .bot { height: 430px; width: auto; display: block; filter: drop-shadow(0 26px 40px rgba(140,28,47,.35)); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">Hamcodes<i> / </i><b>Books</b></div>
  <div class="body">
    <div class="copy">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="headline"></h1>
    </div>
    <div class="art" id="art"></div>
  </div>
  <div class="meta" id="meta"></div>
  <div class="bar"></div>
</div>

<script src="/scripts/og/cards.js"></script>
<script>
  var i = Number(new URLSearchParams(location.search).get("i") || 0);
  var c = window.OG_CARDS[i];
  var card = document.getElementById("card");

  document.getElementById("eyebrow").textContent = c.eyebrow;
  document.getElementById("headline").textContent = c.headline;
  document.getElementById("meta").textContent = c.meta;

  if (c.cover) {
    card.querySelector("#art").innerHTML =
      '<div class="cover" style="background:' + c.cover.fill + ';color:' + (c.cover.ink || "#fff") + '">' +
      '<span>' + c.cover.label + '</span></div>';
  } else if (c.bot) {
    card.querySelector("#art").innerHTML =
      '<img class="bot" src="/assets/img/hero-bot.png" alt="">';
  } else {
    card.classList.add("wide");
  }

  if (c.headline.length > 30) card.classList.add("long");
  if (c.headline.length > 44) card.classList.add("longer");

  /* og.js waits for this before it shoots, so a card is never captured with
     the fonts or the mascot still loading. */
  Promise.all([document.fonts.ready].concat(
    Array.prototype.map.call(document.images, function (img) {
      return img.complete ? null : new Promise(function (r) { img.onload = img.onerror = r; });
    })
  )).then(function () { document.documentElement.setAttribute("data-og-ready", "1"); });
</script>
</body>
</html>
