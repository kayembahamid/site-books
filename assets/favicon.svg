<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Hamcodes Books</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b1526"/>
      <stop offset="1" stop-color="#25080f"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".28" r=".62">
      <stop offset="0" stop-color="#ff8fa0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff8fa0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#lamp)"/>

  <!-- the mark, blurred underneath itself so it lights the tile -->
  <g fill="#ffd9de" filter="url(#soft)" opacity=".9">
    <rect x="12" y="13" width="17" height="4.5" rx="1.4"/>
    <rect x="35" y="13" width="17" height="4.5" rx="1.4"/>
    <rect x="17" y="13" width="7" height="38" rx="1.2"/>
    <rect x="40" y="13" width="7" height="38" rx="1.2"/>
    <rect x="22" y="29" width="20" height="6" rx="1.2"/>
    <rect x="12" y="46.5" width="17" height="4.5" rx="1.4"/>
    <rect x="35" y="46.5" width="17" height="4.5" rx="1.4"/>
  </g>
  <g fill="#f7efe6">
    <rect x="12" y="13" width="17" height="4.5" rx="1.4"/>
    <rect x="35" y="13" width="17" height="4.5" rx="1.4"/>
    <rect x="17" y="13" width="7" height="38" rx="1.2"/>
    <rect x="40" y="13" width="7" height="38" rx="1.2"/>
    <rect x="22" y="29" width="20" height="6" rx="1.2"/>
    <rect x="12" y="46.5" width="17" height="4.5" rx="1.4"/>
    <rect x="35" y="46.5" width="17" height="4.5" rx="1.4"/>
  </g>

  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.4" fill="none"
        stroke="#ff9fae" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
